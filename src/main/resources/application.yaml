spring:
  application:
    name: AtsRagBackend

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768

    openai:
      timeout: 5m
      api-key: "global-dummy-api-key" # to satisfy API key requirement, to declare beans for "audio", "image" and other models
      chat:
        base-url: "https://ollama.com/v1"
        api-key: ${OLLAMA_API_KEY}
        model: "nemotron-3-nano:30b"
        max-tokens: 4096
      embedding:
        base-url: "http://localhost:11434/v1"
        api-key: "local-dummy-api-key" # to satisfy API key requirement, local Ollama server ignores this value
        model: "nomic-embed-text"

apify:
  api:
    token: ${APIFY_API_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: info
  pattern:
    # This is the default Spring Boot console pattern, but `%m` (message) is wrapped in the %replace function to replace newlines, carriage returns, and tabs with underscores. Prevent log injection.
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %replace(%m){'[\\r\\n\\t]', '_'}%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

---

spring:
  config:
    activate:
      on-profile:
        - dev
        - test
    import:
      - optional:file:.env[.properties]
  jpa:
    show-sql: true
logging:
  level:
    com.example.atsragbackend.*: DEBUG