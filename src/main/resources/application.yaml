spring:
  application:
    name: AtsRagBackend

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768

# Apify configuration mapping for ApifyService.java
apify:
  api:
    token: ${APIFY_API_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: info

---

spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:file:.env[.properties]
  jpa:
    show-sql: true
logging:
  level:
    com.example.atsragbackend.*: DEBUG
    # Logs the raw HTTP requests, JSON payloads, and options sent to Ollama API
    #org.springframework.ai.ollama: TRACE
    # Logs the high-level ChatClient prompt construction and responses
    #org.springframework.ai.chat.client: DEBUG
    # Logs the underlying Spring RestClient HTTP traffic
    #org.springframework.web.client.RestClient: DEBUG